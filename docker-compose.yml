services:
  user-db:
    image: postgres:16
    container_name: chatapp_user_db
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-chatapp_user_service}
      POSTGRES_USER: ${USER_DB_USER:-chatapp_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-chatapp_password}
    ports:
      - "${USER_DB_PORT:-5432}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-chatapp_user} -d ${USER_DB_NAME:-chatapp_user_service}"]
      interval: 10s
      timeout: 5s
      retries: 5    

  redis:
    image: redis:7
    container_name: chatapp_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - chatapp_network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: chatapp_mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-db:
    image: mysql:8.0
    container_name: chatapp_auth_db
    environment:
      - MYSQL_DATABASE=${AUTH_DB_NAME:-chatapp_auth_service} # use environment variable or default to 'chatapp_auth_service'
      - MYSQL_USER=${AUTH_DB_USER:-chatapp_auth_user}
      - MYSQL_PASSWORD=${AUTH_DB_PASSWORD:-chatapp_auth_password}
      - MYSQL_ROOT_PASSWORD=${AUTH_DB_ROOT_PASSWORD:-chatapp_rootpassword} 
    ports:
      - "${AUTH_DB_PORT:-3306}:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_DB_ROOT_PASSWORD:-chatapp_rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: chatapp_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672" # RabbitMQ main port
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # RabbitMQ management UI port
    networks:
      - chatapp_network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/dockerfile
    container_name: chatapp_auth_service
    ports:
      - "${AUTH_SERVICE_PORT:-4003}:4003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-4003}
      AUTH_DB_URL: mysql://${AUTH_DB_USER:-chatapp_auth_user}:${AUTH_DB_PASSWORD:-chatapp_auth_password}@auth-db:${AUTH_DB_PORT:-3306}/${AUTH_DB_NAME:-chatapp_auth_service}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_jwt_refresh_secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-your_internal_api_token}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:${RABBITMQ_PORT:-5672}
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_SERVICE_PORT:-4003}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/dockerfile
    container_name: chatapp_gateway_service
    ports:
      - "${GATEWAY_PORT}:4000"
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_PORT: ${GATEWAY_PORT}
      AUTH_SERVICE_URL: http://auth-service:4003
      USER_SERVICE_URL: http://user-service:4001
      CHAT_SERVICE_URL: http://chat-service:4002
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-your_internal_api_token}
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/dockerfile
    container_name: chatapp_user_service
    ports:
      - "${USER_SERVICE_PORT}:4001"
    environment:
      NODE_ENV: development
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-4001}
      USER_DB_URL: postgres://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  
  chat-service:
    build: 
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chatapp-chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-4002}:4002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-4002}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chatapp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    
volumes:
  auth_db_data:
  user_db_data:
  mongo_data:
  redis-data:
  rabbitmq-data:

# Define the custom network for the chat application services
# This network allows the services to communicate with each other using their service names as hostnames.
# The 'bridge' driver is used for simplicity, but you can choose other drivers based on your needs (e.g., overlay for swarm mode).
networks:
  chatapp_network:
    driver: bridge